<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --accent: #2563eb;
  --muted: #6b7280;
  --border: #e5e7eb;
  --surface: #f9fafb;
  --radius: 6px;
  font-family: system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --fg: #f9fafb;
    --accent: #60a5fa;
    --muted: #9ca3af;
    --border: #374151;
    --surface: #1f2937;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--fg); padding: 1rem; }

/* Layout: adapt these sections to the skill's needs */
.container { max-width: 1200px; margin: 0 auto; }
header { padding: 1rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
h1 { font-size: 1.5rem; font-weight: 600; }
.subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }

/* Sections — replace with skill-specific layout */
.workspace { display: grid; gap: 1rem; }
@media (min-width: 768px) { .workspace { grid-template-columns: 1fr 2fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}
.panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>{{title}}</h1>
    <div class="subtitle">Generated by {{skill_name}} · {{date}}</div>
  </header>
  <div class="workspace">
    <!-- Replace with skill-specific panels and controls -->
    <div class="panel">
      <h2>Controls</h2>
      <p>Skill-specific controls go here.</p>
    </div>
    <div class="panel">
      <h2>Results</h2>
      <p>Skill-specific results go here.</p>
    </div>
  </div>
</div>
<script>
// Skill-specific interactivity goes here.
// Keep it dependency-free and offline-capable.
</script>
</body>
</html>
